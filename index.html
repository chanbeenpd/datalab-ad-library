<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>장기렌트 광고 모음</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
<style>
:root{--blue:#1E53F2;--cyan:#00ABCE;--ink:#0f172a;--sub:#64748b;--line:#e6eaf3;--paper:#f5f7fc}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}
body{font-family:"Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif;background:var(--paper);color:var(--ink);word-break:keep-all;line-height:1.6;-webkit-font-smoothing:antialiased}
.w{max-width:1200px;margin:0 auto;padding:0 22px}

/* 표지 */
.hero{position:relative;overflow:hidden;color:#fff;background:#071a5c;padding:70px 0 84px}
.hero:before{content:"";position:absolute;inset:0;background:
  radial-gradient(600px 380px at 85% 10%,rgba(0,171,206,.55),transparent 60%),
  radial-gradient(700px 500px at 10% 120%,rgba(30,83,242,.9),transparent 60%),
  linear-gradient(140deg,#06154a,#0b2a8c 55%,#1E53F2)}
.hero:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(180deg,#000,transparent 90%)}
.hero .w{position:relative;z-index:1}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.18em;color:#9ff3ff;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);padding:7px 14px;border-radius:99px}
.eyebrow:before{content:"";width:7px;height:7px;border-radius:50%;background:#7ff0ff;box-shadow:0 0 12px #7ff0ff}
.hero h1{font-size:clamp(34px,5.6vw,60px);font-weight:900;letter-spacing:-.035em;line-height:1.15;margin:18px 0 12px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#7ff0ff,#b9d0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:rgba(255,255,255,.78);font-size:clamp(15px,1.6vw,17px)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:12px;margin-top:30px;max-width:1040px}
.stat{background:linear-gradient(160deg,rgba(255,255,255,.15),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(6px);border-radius:18px;padding:14px 18px}
.stat b{display:block;font-size:28px;font-weight:900;letter-spacing:-.02em}
.stat span{font-size:12px;color:rgba(255,255,255,.7);font-weight:600}

/* 도구줄 */
.tools{position:sticky;top:0;z-index:20;background:rgba(245,247,252,.9);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.tools .w{display:flex;flex-direction:column;gap:10px;padding-top:14px;padding-bottom:12px}
.row1{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:4px;background:#e9edf6;padding:4px;border-radius:14px;overflow-x:auto;max-width:100%}
.tab{border:0;background:none;font:inherit;font-size:14px;font-weight:700;color:var(--sub);padding:8px 14px;border-radius:10px;cursor:pointer;white-space:nowrap}
.tab small{font-size:12px;opacity:.7;margin-left:3px}
.tab.sep{margin-left:10px;position:relative}.tab.sep:before{content:"";position:absolute;left:-7px;top:9px;bottom:9px;width:1px;background:#cbd5e1}
.tab.on{background:#fff;color:var(--blue);box-shadow:0 2px 8px rgba(15,23,42,.08)}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:11px 14px 11px 38px;border-radius:12px;border:1px solid var(--line);font:inherit;font-size:15px;background:#fff;outline:none}
.search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(30,83,242,.12)}
.search:before{content:"";position:absolute;left:14px;top:50%;width:13px;height:13px;margin-top:-8px;border:2px solid #94a3b8;border-radius:50%}
.search:after{content:"";position:absolute;left:26px;top:50%;width:6px;height:2px;margin-top:5px;background:#94a3b8;transform:rotate(45deg)}
#chips{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:2px}
@media(max-width:640px){#chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font:inherit;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer}
.chip:before{content:"#";opacity:.5;margin-right:1px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* 섹션 */
main{padding:10px 0 80px}
.sec{margin-top:38px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:16px}
.sec-h h2{font-size:clamp(20px,2.4vw,24px);font-weight:900;letter-spacing:-.02em}
.sec-h span{font-size:14px;color:var(--sub);font-weight:600}
.sec-h p{font-size:14px;color:var(--sub);margin-left:auto}
.grid{display:grid;gap:18px}
.grid.v{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.grid.h{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}

/* 카드 */
.card{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(15,23,42,.10)}
.media{position:relative;background:#000;aspect-ratio:9/14;cursor:pointer;overflow:hidden}
.grid.h .media{aspect-ratio:16/9}
.media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.card:hover .media img{transform:scale(1.04)}
.media:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),transparent 30%,transparent 55%,rgba(0,0,0,.75))}
.play{position:absolute;z-index:2;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(8px);border:1.5px solid rgba(255,255,255,.6);display:grid;place-items:center;transition:transform .2s,background .2s}
.play:before{content:"";margin-left:4px;border-left:16px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent}
.card:hover .play{transform:scale(1.1);background:var(--blue);border-color:var(--blue)}
.src{position:absolute;z-index:2;left:12px;top:12px;background:rgba(255,255,255,.92);color:var(--ink);font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px}
.src.our{background:var(--blue);color:#fff}
.len{position:absolute;z-index:2;right:12px;bottom:12px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px}
.fmt{position:absolute;z-index:2;left:12px;bottom:12px;color:#fff;font-size:12px;font-weight:700;opacity:.9}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.body h3{font-size:16.5px;line-height:1.42;letter-spacing:-.015em;font-weight:800}
.hook{position:relative;font-size:14px;font-weight:600;color:#334155;padding-left:14px}
.hook:before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:3px;border-radius:3px;background:linear-gradient(var(--blue),var(--cyan))}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tags span{font-size:12px;background:#eef2ff;color:var(--blue);padding:3px 9px;border-radius:99px;font-weight:700}
details{font-size:14px;color:var(--sub);border-top:1px dashed var(--line);padding-top:10px;margin-top:auto}
details summary{cursor:pointer;font-weight:800;color:var(--ink);font-size:13.5px;list-style:none;display:flex;align-items:center;gap:6px}
details summary::-webkit-details-marker{display:none}
details summary:after{content:"";width:7px;height:7px;border-right:2px solid var(--sub);border-bottom:2px solid var(--sub);transform:rotate(45deg);margin-top:-3px;transition:transform .2s}
details[open] summary:after{transform:rotate(225deg);margin-top:3px}
details dl{margin-top:10px;display:grid;gap:4px}
details dt{font-weight:800;color:var(--ink);font-size:12.5px}
details dd{margin:0 0 6px;line-height:1.55}
.steal{background:linear-gradient(135deg,#fff8e8,#fff3d6);border-radius:12px;padding:9px 12px;color:#7a4b00;font-size:13px;font-weight:600}
.steal b{font-weight:900}
.warn{font-size:12px;color:#c0392b;font-weight:700}
.grid.h .media.tall{aspect-ratio:16/9;background:#0b1020}.grid.h .media.tall img{object-fit:contain}
.ind{display:inline-block;vertical-align:2px;font-size:11px;font-weight:800;color:#b45309;background:#fef3c7;padding:2px 7px;border-radius:6px;margin-right:6px}
.grid.kcg{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.kc{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}
.kc:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(15,23,42,.10)}
.kc-img{aspect-ratio:1/1;background:#000;overflow:hidden}
.kc-img img{width:100%;height:100%;object-fit:cover;display:block}
.kc-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px}
.kc-copy{font-size:18px;font-weight:900;line-height:1.45;letter-spacing:-.02em}
.kc-meta{display:flex;align-items:center;gap:8px;font-size:13px}
.kc-meta b{color:var(--ink)}
.kc-meta span{background:#f3e8ff;color:#7c3aed;font-weight:800;font-size:12px;padding:2px 9px;border-radius:99px}
.kc-pt{font-size:13px;color:var(--sub);background:#f8fafc;border-radius:10px;padding:8px 10px}
.more{display:block;margin:18px auto 0;border:1px solid var(--line);background:#fff;border-radius:99px;padding:11px 22px;font:inherit;font-weight:800;color:var(--blue);cursor:pointer}
.st-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(480px,1fr));gap:18px}
.st-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px}
.st-card h3{font-size:17px;font-weight:900;letter-spacing:-.02em}
.st-sub{font-size:12.5px;color:var(--sub);margin:4px 0 12px}
.br{display:grid;grid-template-columns:150px 1fr 42px 34px;align-items:center;gap:8px;margin:5px 0;font-size:13px}
.bk{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#334155;font-weight:600}
.bb{height:12px;background:#eef2f8;border-radius:99px;overflow:hidden}.bb i{display:block;height:100%;border-radius:99px}
.br b{text-align:right}.br small{color:#16a34a;font-weight:800;font-size:11px}
@media(max-width:640px){.st-grid{grid-template-columns:1fr}.br{grid-template-columns:96px 1fr 34px 28px;font-size:12px}}
.track{margin-top:-30px;position:relative;z-index:5}
.tk{background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:0 30px 70px -20px rgba(15,23,42,.22);padding:30px 30px 18px}
.tk-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.tk-h .lab{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:.12em;color:var(--blue);background:#eef3ff;padding:5px 11px;border-radius:99px}
.tk-h .lab:before{content:"";width:6px;height:6px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.2)}
.tk-h h2{font-size:clamp(21px,2.4vw,27px);font-weight:900;letter-spacing:-.03em;margin-top:8px}
.tk-h p{font-size:13px;color:var(--sub);margin-top:2px}
.tk-kpi{display:flex;gap:10px;flex-wrap:wrap}
.tk-kpi div{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:10px 16px;min-width:118px}
.tk-kpi b{display:block;font-size:22px;font-weight:900;letter-spacing:-.02em;line-height:1.2}
.tk-kpi span{font-size:11.5px;color:var(--sub);font-weight:700}
.tk-kpi .g b{color:#16a34a}
.tk-top{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
.pod{position:relative;border-radius:22px;padding:18px 20px;cursor:pointer;border:1px solid var(--line);background:linear-gradient(160deg,#fff,#f6f8fd);transition:transform .2s,box-shadow .2s;overflow:hidden}
.pod:hover{transform:translateY(-3px);box-shadow:0 16px 34px -12px rgba(30,83,242,.35)}
.pod.p1{background:linear-gradient(150deg,#1E53F2,#0b2a8c);color:#fff;border-color:transparent}
.pod .rkb{position:absolute;right:16px;top:14px;font-size:44px;font-weight:900;letter-spacing:-.04em;opacity:.12;line-height:1}
.pod .nm{font-size:16px;font-weight:900;display:flex;align-items:center;gap:8px}
.pod .big{font-size:38px;font-weight:900;letter-spacing:-.03em;line-height:1.1;margin-top:10px}
.pod .big small{font-size:14px;font-weight:700;opacity:.65;margin-left:4px}
.pod .sub{font-size:12.5px;opacity:.75;margin-top:2px}
.pod .split{margin-top:12px}
.pod.p1 .split .sp{background:rgba(255,255,255,.18)}
.av{flex:none;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;font-size:13px;font-weight:900;color:#fff}
.pod.p1 .av{background:rgba(255,255,255,.2)!important}
.sp{display:flex;height:8px;border-radius:99px;overflow:hidden;background:#eef2f8}
.sp i{display:block;height:100%}.sp .v{background:#1E53F2}.sp .m{background:#00ABCE}.sp .u{background:#a5b4cf}
.pod.p1 .sp .v{background:#fff}.pod.p1 .sp .m{background:#7ff0ff}.pod.p1 .sp .u{background:rgba(255,255,255,.5)}
.lg{display:flex;gap:12px;font-size:11.5px;color:var(--sub);font-weight:700;margin-top:6px}
.pod.p1 .lg{color:rgba(255,255,255,.75)}
.lg span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:4px;background:#1E53F2}
.lg .m:before{background:#00ABCE}.pod.p1 .lg span:before{background:#fff}.pod.p1 .lg .m:before{background:#7ff0ff}
.tk-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:18px}
.tk table{width:100%;border-collapse:collapse;min-width:820px;font-size:14px}
.tk thead tr.grp th{font-size:11px;letter-spacing:.06em;color:#94a3b8;padding:10px 12px 0;border:0;text-align:center}
.tk thead tr.grp th.gm{color:var(--blue)}
.tk th{font-size:12px;color:var(--sub);font-weight:700;text-align:left;padding:6px 12px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fafbfe}
.tk th.c,.tk td.c{text-align:center}
.tk td{padding:11px 12px;border-bottom:1px solid #f1f4f9;vertical-align:middle}
.tk tbody tr:last-child td{border-bottom:0}
.tk tr.r{cursor:pointer;transition:background .15s}.tk tr.r:hover td{background:#f7f9fe}
.tk tr.ours td{background:#eef4ff}.tk tr.ours:hover td{background:#e5eeff}
.tk .rk{width:56px}
.rkc{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-size:12px;font-weight:900;color:#64748b;background:#f1f4f9}
.tk .nmc{display:flex;align-items:center;gap:10px;font-weight:800;white-space:nowrap}
.ourb{font-size:10.5px;font-weight:900;color:#fff;background:var(--blue);padding:2px 7px;border-radius:99px}
.tk .mb{display:flex;align-items:center;gap:10px}
.tk .mb .bar{display:block;width:170px;height:9px;border-radius:99px;background:#eef2f8;overflow:hidden}
.tk .mb .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#1E53F2,#00ABCE)}
.tk .mb b{min-width:30px;font-size:15px;font-weight:900}
.tk .vi{font-size:12.5px;color:var(--sub);white-space:nowrap}.tk .vi b{color:var(--ink);font-weight:800}
.pill{display:inline-block;min-width:38px;text-align:center;font-size:12.5px;font-weight:800;padding:3px 10px;border-radius:99px}
.pill.g{color:#15803d;background:#dcfce7}.pill.b{color:#1d4ed8;background:#e0eaff}.pill.n{color:#047857;background:#d1fae5}
.tk .na{color:#cbd5e1;font-weight:700}
.tip{position:relative;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#f1f4f9;color:#64748b;font-size:12px;font-weight:900;font-style:normal;cursor:help}
.tip:hover,.tip:focus{background:var(--blue);color:#fff;outline:0}
.tip>span{display:none;position:absolute;right:0;top:28px;z-index:9;width:280px;background:#0f172a;color:#e2e8f0;font-size:12px;font-weight:500;line-height:1.55;text-align:left;padding:10px 12px;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.25);white-space:normal}
.tip:hover>span,.tip:focus>span{display:block}
.tk-more{display:block;margin:14px auto 4px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:9px 20px;color:var(--blue);font:inherit;font-size:14px;font-weight:800;cursor:pointer}
.tk-more:hover{background:#eef3ff}
.tk-foot{font-size:11.5px;color:#94a3b8;margin-top:10px;line-height:1.6}
.tk td.xm{display:none}
@media(max-width:820px){.tk-top{gap:8px}.pod{padding:14px}.pod .big{font-size:28px}.pod .lg{display:none}}
@media(max-width:640px){
  .tk{padding:20px 14px 12px;border-radius:22px}.track{margin-top:-20px}
  .tk-kpi{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.tk-kpi div{min-width:0;padding:8px 10px}.tk-kpi b{font-size:18px}
  .tk-top{grid-template-columns:1fr;gap:8px}
  .pod{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:10px;padding:14px 16px}
  .pod .big{margin:0;font-size:26px;grid-row:1/3;grid-column:2}.pod .sub{grid-column:1}.pod .split,.pod .rkb{display:none}
  .tk-wrap{border:0;overflow:visible}.tk table{min-width:0;display:block}.tk thead{display:none}.tk tbody{display:block}
  .tk tbody tr.r{display:grid;grid-template-columns:34px 1fr auto;gap:4px 8px;padding:12px 8px;border-bottom:1px solid #f1f4f9;align-items:center}
  .tk tbody tr.r td{padding:0;border:0;background:none!important}
  .tk tr.ours{background:#eef4ff;border-radius:14px}
  .tk td.rk{grid-row:1/3;width:auto}.tk td.nmw{grid-column:2}.tk td.mt{grid-column:3;grid-row:1}.tk td.mt .bar{display:none}
  .tk td.x{display:none}.tk td.xm{display:flex;grid-column:2/4;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--sub)}
  .tk td.xm .pill{font-size:11.5px;padding:2px 8px}
}

.ppl{margin-top:22px}
.ppl .tk-h{margin-bottom:16px}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pc{border:1px solid var(--line);border-radius:18px;padding:14px 16px;background:linear-gradient(160deg,#fff,#f8faff)}
.pc.ours{border-color:#bcd0ff;background:linear-gradient(160deg,#f3f7ff,#e9f0ff)}
.pc h3{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:900;margin-bottom:8px}
.pc h3 small{margin-left:auto;font-size:11.5px;color:var(--sub);font-weight:700}
.ch{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:7px 0;border-top:1px dashed #e6eaf3;font-size:13.5px}
.ch a{color:var(--ink);font-weight:800;text-decoration:none}.ch a:hover{color:var(--blue)}
.ch .sb{font-size:12.5px;color:var(--sub);font-weight:700}
.st{font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;white-space:nowrap}
.st.on{color:#15803d;background:#dcfce7}.st.self{color:#1d4ed8;background:#e0eaff}.st.off{color:#64748b;background:#f1f5f9}.st.stop{color:#b45309;background:#fef3c7}
.ch .nt{grid-column:1/4;font-size:11.5px;color:var(--sub);margin-top:-3px}
.ch .nt b{color:#dc2626}
.tk-q{display:block;margin:0 0 12px;width:100%;max-width:320px;padding:9px 14px;border-radius:12px;border:1px solid var(--line);font:inherit;font-size:14px;outline:none}
.tk-q:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(30,83,242,.12)}
.hl{display:inline-grid;place-items:center;height:22px;padding:0 8px;border-radius:99px;background:#eef3ff;color:var(--blue);font-size:11px;font-weight:800;text-decoration:none;white-space:nowrap}.hl:hover{background:var(--blue);color:#fff}.hl.fb{background:#f1f5f9;color:#64748b}.pod.p1 .hl{background:rgba(255,255,255,.18);color:#fff}
.rkc.m1{background:#fde68a;color:#92400e}.rkc.m2{background:#e2e8f0;color:#334155}.rkc.m3{background:#fed7aa;color:#9a3412}
.yth{display:flex;align-items:center;gap:10px}.ytl{width:34px;height:24px;flex:none}

/* 현황판 v3 (보고용) */

function 통계(){

  for(const [분류,설명] of 분류순){
    if(분류==='광고 키카피 문구') continue;
    const 목록=광고.filter(a=>a.분류===분류&&맞음(a));
    if(!목록.length) continue;
    if(분류==='네이버 검색광고'||분류==='구글 광고'||분류==='광고 집행 통계') continue;

      ${접기?`<button class="more" data-k="${분류}">${목록.length}편 전체 보기 →</button>`:''}</section>`;
  }
  if(탭==='구글 광고'){
    const 목록=구글.filter(g=>(!태그||g.domain===태그)&&(!k||JSON.stringify(g).toLowerCase().includes(k)));
    if(목록.length) html+=`<section class="sec"><div class="sec-h"><h2>구글 광고</h2><span>${목록.length}개</span><p>2026-11-26 수집 · 단기렌트·중고차·보험·빈 화면 제외 · 동영상 소재는 투명성 센터 링크에서 재생</p></div>
      <div class="grid kcg">${목록.map(구글카드).join('')}</div></section>`;

    const 목록=네이버.filter(n=>!n.ex&&(!태그||n.kw===태그)&&(!k||JSON.stringify(n).toLowerCase().includes(k)));

    if(키목록.length && 네이버.some(n=>n.rank)) html+=`<section class="sec"><div class="sec-h"><h2>네이버 파워링크 순위표</h2><span>키워드 ${키목록.length}개</span><p>${네이버수집} · PC 광고 목록(ad.search.naver.com) 노출 순서 1~10위 · 시간·사용자에 따라 순서가 바뀔 수 있음</p></div>

      <tbody>${키목록.map(kw=>`<tr><td style="padding:6px 8px;border-bottom:1px solid #eef1f5;font-weight:700;position:sticky;left:0;background:#fff;white-space:nowrap">${kw}</td>${순위칸(kw)}</tr>`).join('')}</tbody></table></div></section>`;

    if(목록.length) html+=`<section class="sec"><div class="sec-h"><h2>광고 키카피 문구</h2><span>${목록.length}개</span><p>장기렌트와 상관없이 모아 둔 한 줄 광고 문구</p></div>
