<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>광고 모음 | 본사 광고기획팀</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
<style>
:root{--blue:#1E53F2;--cyan:#00ABCE;--ink:#111827;--sub:#5f6b80;--line:#e3e8f2;--paper:#f4f6fb}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif;background:var(--paper);color:var(--ink);word-break:keep-all;line-height:1.6}
a{color:inherit}
header{background:linear-gradient(140deg,#0b2a8c,#1E53F2 60%,#3b7dff);color:#fff;padding:40px 20px 30px}
.w{max-width:1180px;margin:0 auto;padding:0 20px}
header .w{padding:0}
header small{letter-spacing:.18em;font-size:12px;font-weight:800;color:#7ff0ff}
header h1{font-size:clamp(28px,4vw,40px);letter-spacing:-.02em;margin:6px 0 6px}
header p{color:rgba(255,255,255,.8);font-size:15px}
.tools{position:sticky;top:0;z-index:10;background:rgba(244,246,251,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 0}
.tools .w{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tools input{flex:1;min-width:180px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);font:inherit;font-size:15px;background:#fff}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font:inherit;font-size:14px;font-weight:600;color:var(--sub);cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.count{font-size:13px;color:var(--sub);margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;padding:24px 0 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.media{position:relative;background:#000;aspect-ratio:9/12;cursor:pointer}
.media.wide{aspect-ratio:16/9}
.media img{width:100%;height:100%;object-fit:cover;display:block;opacity:.92}
.media video{width:100%;height:100%;display:block;background:#000}
.media .play{position:absolute;inset:0;margin:auto;width:58px;height:58px;border-radius:50%;background:rgba(231,33,27,.92);color:#fff;display:grid;place-items:center;font-size:20px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.media .len{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.7);color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px}
.media .src{position:absolute;left:10px;top:10px;background:var(--blue);color:#fff;font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h3{font-size:17px;line-height:1.4;letter-spacing:-.01em}
.meta{font-size:13px;color:var(--sub)}
.hook{background:#f2f5fd;border-left:3px solid var(--blue);border-radius:8px;padding:8px 10px;font-size:14px;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:12px;background:#eef2ff;color:var(--blue);padding:3px 9px;border-radius:99px;font-weight:600}
details{font-size:14px;color:var(--sub)}
details summary{cursor:pointer;font-weight:700;color:var(--ink);font-size:14px;margin-top:2px}
details dl{margin-top:8px;display:grid;gap:6px}
details dt{font-weight:800;color:var(--ink);font-size:13px}
details dd{margin:0 0 4px}
.steal{background:#fff7e6;border-radius:10px;padding:8px 10px;color:#7a4b00;font-size:13px}
.warn{font-size:12px;color:#c0392b;font-weight:700}
@media(max-width:600px){#chips{display:flex;gap:6px;overflow-x:auto;white-space:nowrap;width:100%;padding-bottom:4px}#chips .chip{flex:none}.count{margin-left:0}}
.empty{padding:60px 0;text-align:center;color:var(--sub)}
</style>
</head>
<body>
<header><div class="w">
  <small>AD LIBRARY</small>
  <h1>광고 모음</h1>
  <p>좋은 광고를 모아 두고, 다음 광고를 만들 때 꺼내 쓰는 곳입니다. 카드를 누르면 바로 재생됩니다.</p>
</div></header>

<div class="tools"><div class="w">
  <input id="q" placeholder="검색: 브랜드, 훅, 장치…">
  <div id="chips"></div>
  <span class="count" id="count"></span>
</div></div>

<main class="w"><div class="grid" id="grid"></div><div class="empty" id="empty" hidden>찾는 광고가 없습니다.</div></main>

<script>
/* ▼ 광고 추가는 여기에 한 줄씩 (노아가 관리) */
const 광고 = [
  {제목:'처음 제시한 견적 그대로 출고', 브랜드:'다타랩', 업종:'장기렌트', 형식:'세로 숏폼', 길이:'0:30', 날짜:'2026-11-19',
   파일:'영상/광고1.mp4', 썸네일:'썸네일/광고1.jpg',
   훅:'"너도나도 최저가 견적… 하지만 금세 말이 바뀌고 금액이 바뀝니다"',
   구조:'업계 불신 제기 → 반전(처음 견적 그대로 출고) → 증거(10년 금융사고 없음·월 2,000대 출고) → 무료 견적',
   장치:'공포 해소, 사회적 증거(숫자), 영화풍 B롤 + 내레이션',
   훔칠것:'"처음 견적 그대로 출고" 한 줄 약속 + 숫자 2개로 신뢰 마무리',
   태그:['신뢰','업계 불신','브랜드 광고']},
  {제목:'현금보다 장기렌트가 싼 거 실화냐', 브랜드:'다타랩', 업종:'장기렌트', 형식:'커뮤니티 썰 숏폼', 길이:'0:53', 날짜:'2026-11-19',
   파일:'영상/광고2.mp4', 썸네일:'썸네일/광고2.jpg',
   훅:'"지인이 신차 뽑았다고 자랑… 장기렌트 인수형? 무조건 손해네 했는데"',
   구조:'의심 → 견적서 계산해 보니 현금보다 쌈 → 이유(면세가+특판 할인) → 사업자·직장인도 이렇게 산다 → 업체명+혜택 → 견적 권유',
   장치:'광고 티 안 나는 간접 훅(갤러리 글·밈), 실제 견적표, 반전',
   훔칠것:'"지인 썰"로 시작하는 간접 훅, "차 좀 아는 사람은 이렇게 산다"',
   주의:'영상 속 "국내 1위" 표현 — 근거 표기 필요',
   태그:['썰형','가격 반전','특판']},
  {제목:'테슬라는 제발 장기렌트로 사세요', 브랜드:'차즘(Chazm)', 업종:'장기렌트', 형식:'전문가 토크 숏폼', 길이:'1:20', 날짜:'2026-11-19',
   파일:'영상/광고3.mp4', 썸네일:'썸네일/광고3.jpg',
   훅:'"요즘 모델3 장기렌트 추천 이유 — 테슬라는 제발 장기렌트로"',
   구조:'가격 인하 → 내 차 중고가 즉시 감가 → 감가 위험은 렌트로 회피 / 렌트 요금은 수시로 변함 → 나에게 가장 싼 곳 실시간 매칭',
   장치:'차종 이슈 시의성, 손실 회피, 전문가 신뢰',
   훔칠것:'차종 이슈 터질 때 "이 차는 렌트로" 시리즈, 감가 위험을 렌트사에 넘기는 논리',
   태그:['시의성','감가','전문가']},
  {제목:'할부로 뽑으면 얼마 손해인지 아세요?', 브랜드:'리스렌트성지', 업종:'장기렌트', 형식:'라이브 방송형 숏폼', 길이:'0:45', 날짜:'2026-11-19',
   파일:'영상/광고4.mp4', 썸네일:'썸네일/광고4.jpg',
   훅:'"3천만 원 차 할부로 사면 5년 뒤 반도 못 받아요"',
   구조:'할부 손해(보험료·세금·감가) → 렌트는 내 명의 자산 아님 → 모든 비용 월 렌트료 포함 → 1:1 금융 분석 CTA',
   장치:'손실 질문형 훅, 라이브 방송 화면(댓글창), 하단 고정 문구',
   훔칠것:'"얼마 손해인지 아세요?" 질문형 훅, 라이브 방송 형식',
   태그:['질문형 훅','유지비','라이브형']},
  {제목:'모델 지안 × 다타랩 브랜드 광고', 브랜드:'다타랩TV', 업종:'장기렌트', 형식:'브랜드 광고', 길이:'1:22', 날짜:'2026-11-19',
   유튜브:'nt9dny6HXI4',
   훅:'"현금으로 차를 사는 게 제일 싸다고요? 아닐 수도 있어요"',
   구조:'통념 제기 → 규모 큰 렌트사 → 특판 출고 최대 20% → 금융사 많을수록 유리 → 월 2,000대 다타랩 → 무료 견적',
   장치:'모델 진행, 통념 반전, 숫자',
   훔칠것:'첫 문장 훅 "제일 싸다고요? 아닐 수도 있어요"',
   태그:['브랜드 광고','가격 반전','특판']},
  {제목:'채널주인 부재중 × 다타랩 3부작 (EP.1 상담)', 브랜드:'다타랩', 업종:'장기렌트', 형식:'크리에이터 PPL', 길이:'20:22', 날짜:'2026-08-22',
   유튜브:'DujwLpKaq60',
   훅:'"34년 뚜벅이 차알못의 첫 차 고민"',
   구조:'출연자의 실제 고민 → 다타랩 30분 상담으로 해결 → (EP.2 출고 → EP.3 첫 드라이브)',
   장치:'시리즈 서사, 일상 속 자연 노출, 채널 전용 혜택 링크',
   훔칠것:'상담→출고→드라이브 3부작 구조로 PPL을 이야기로 만들기',
   태그:['크리에이터 PPL','시리즈','일상형']},
  {제목:'채널주인 부재중 × 다타랩 3부작 (EP.2 출고)', 브랜드:'다타랩', 업종:'장기렌트', 형식:'크리에이터 PPL', 길이:'21:36', 날짜:'2026-09-12',
   유튜브:'NCeFpKIGVvw',
   훅:'"첫 차로 BMW를 뽑은 33살 장롱면허남의 이야기"',
   구조:'(제목 기준 정리, 상세 분석 전) EP.1 상담 결과 → 차량 출고·인도 현장 → 첫 차를 받은 출연자 반응',
   장치:'시리즈 서사, 출고 현장 자연 노출, 출연자 실제 감정',
   훔칠것:'출고 순간의 설렘을 PPL 하이라이트로 쓰기 — "견적 그대로 출고"를 화면으로 증명',
   태그:['크리에이터 PPL','시리즈','일상형']},
  {제목:'채널주인 부재중 × 다타랩 3부작 (EP.3 드라이브)', 브랜드:'다타랩', 업종:'장기렌트', 형식:'크리에이터 PPL', 길이:'27:20', 날짜:'2026-10-08',
   유튜브:'LSytlw7_Z3Q',
   훅:'"남친의 헌팅을 보게 될 줄은 몰랐던 을왕리 드라이브"',
   구조:'(제목 기준 정리, 상세 분석 전) 출고한 차로 첫 장거리 드라이브 → 예능 상황극 중심, 차는 배경으로 자연 노출',
   장치:'예능형 에피소드, 브랜드 언급 최소화, 시리즈 마무리',
   훔칠것:'광고 티 없이 차를 "일상의 무대"로 두는 마무리 편',
   태그:['크리에이터 PPL','시리즈','일상형']},
  {제목:'장기렌트 장단점 + 롯데렌터카 (앗차가와)', 브랜드:'롯데렌터카', 업종:'장기렌트', 형식:'크리에이터 PPL', 길이:'15:31', 날짜:'2026-11-19',
   유튜브:'CoS11_KolqI',
   훅:'"할부보다 렌트가 싸다는 광고에 현혹되면 실망합니다"',
   구조:'과장 광고 바로잡기(정직 포지션) → 렌트가 유리한 경우 → 거래 비용·자금 묶임 해소 → 예산별 추천 차종 → 롯데렌터카 혜택',
   장치:'정직 포지셔닝으로 신뢰 확보, 예산별 차종 리스트',
   훔칠것:'"무조건 싸다고 안 한다"는 정직 화법, 예산대별 차종 추천',
   태그:['크리에이터 PPL','정직 화법','예산별']}
];
/* ▲ */

const grid=document.getElementById('grid'), q=document.getElementById('q'), chips=document.getElementById('chips');
const 모든태그=[...new Set(광고.flatMap(a=>a.태그))];
let 선택='전체';
chips.innerHTML=['전체',...모든태그].map(t=>`<button class="chip${t==='전체'?' on':''}" data-t="${t}">${t}</button>`).join(' ');
chips.onclick=e=>{const b=e.target.closest('.chip'); if(!b) return; 선택=b.dataset.t; chips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b)); 그리기();};
q.oninput=그리기;
function 카드(a,i){
  const yt=a.유튜브, thumb=yt?`https://i.ytimg.com/vi/${yt}/hqdefault.jpg`:a.썸네일;
  return `<article class="card">
    <div class="media${yt?' wide':''}" data-i="${i}"><img src="${thumb}" alt=""><span class="play">▶</span><span class="src">${a.브랜드}</span><span class="len">${a.길이}</span></div>
    <div class="body">
      <h3>${a.제목}</h3>
      <div class="meta">${a.업종} · ${a.형식} · 저장 ${a.날짜}</div>
      <div class="hook">${a.훅}</div>
      <div class="tags">${a.태그.map(t=>`<span>${t}</span>`).join('')}</div>
      <details><summary>분석 보기</summary><dl>
        <dt>구조</dt><dd>${a.구조}</dd><dt>설득 장치</dt><dd>${a.장치}</dd>
      </dl></details>
      <div class="steal">💡 가져다 쓸 점: ${a.훔칠것}</div>
      ${a.주의?`<div class="warn">⚠ ${a.주의}</div>`:''}
    </div></article>`;
}
function 그리기(){
  const k=q.value.trim().toLowerCase();
  const 목록=광고.map((a,i)=>[a,i]).filter(([a])=>(선택==='전체'||a.태그.includes(선택))&&(!k||JSON.stringify(a).toLowerCase().includes(k)));
  grid.innerHTML=목록.map(([a,i])=>카드(a,i)).join('');
  document.getElementById('empty').hidden=목록.length>0;
  document.getElementById('count').textContent=`${목록.length}편`;
}
grid.onclick=e=>{
  const m=e.target.closest('.media'); if(!m||m.dataset.on) return;
  const a=광고[+m.dataset.i]; m.dataset.on=1;
  if(a.유튜브) m.innerHTML=`<iframe src="https://www.youtube.com/embed/${a.유튜브}?autoplay=1&playsinline=1" style="width:100%;height:100%;border:0" allow="autoplay;encrypted-media;fullscreen" allowfullscreen></iframe>`;
  else m.innerHTML=`<video src="${a.파일}" controls autoplay playsinline></video>`;
};
그리기();
</script>
</body>
</html>
